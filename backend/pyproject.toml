[project]
name = "edump-api"
version = "0.0.0"
description = "Private BCS-3E class API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43.110",
    "fastapi>=0.143.0",
    "filetype>=1.2.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pymongo>=4.18.3",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib --cov=app --cov-report=term-missing --cov-fail-under=85"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]
