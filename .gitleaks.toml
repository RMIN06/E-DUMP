[extend]
useDefault = true

[[allowlists]]
description = "Installed dependencies and generated local caches"
paths = ['''(^|[/\\])(node_modules|\.venv|\.expo|coverage|\.git)([/\\]|$)''']

[[allowlists]]
description = "Local environment files; Make and CI reject these if tracked"
paths = ['''(^|[/\\])(backend|mobile)[/\\]\.env$''']
