version: 2
updates:
  - package-ecosystem: npm
    directory: /mobile
    schedule: { interval: weekly }
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

