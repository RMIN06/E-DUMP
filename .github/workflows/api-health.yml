name: API availability

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-availability
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check public API liveness
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 75 \
            --retry 1 --retry-delay 10 --retry-max-time 160 \
            https://edump-api.onrender.com/healthz)
          RESPONSE="$response" python - <<'PY'
          import json
          import os
          result = json.loads(os.environ['RESPONSE'])
          assert result.get('status') == 'ok', 'API returned an unexpected health response'
          print('API liveness passed.')
          PY
